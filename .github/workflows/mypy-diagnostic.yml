name: Mypy diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  diagnose:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Clone and record mypy output
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          AUTH="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${AUTH}" \
            clone --branch "${BRANCH}" --single-branch \
            "https://github.com/${GITHUB_REPOSITORY}.git" .
          python -m pip install --quiet -e '.[dev]'
          set +e
          mypy src >mypy-diagnostic.txt 2>&1
          mypy_status=$?
          set -e
          sed -i "1i mypy status: ${mypy_status}" mypy-diagnostic.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mypy-diagnostic.txt
          git diff --cached --check
          git commit --quiet -m "chore: record mypy diagnostics"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${AUTH}" \
            push origin "HEAD:${BRANCH}"
