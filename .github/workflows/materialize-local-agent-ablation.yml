name: Materialize local AWS Agent ablation

on:
  push:
    branches:
      - agent/local-aws-ablation
    paths:
      - ".bootstrap/aws-agent-ablation/**"
      - ".github/workflows/materialize-local-agent-ablation.yml"
  pull_request:
    branches:
      - main
    paths:
      - ".bootstrap/aws-agent-ablation/**"
      - ".github/workflows/materialize-local-agent-ablation.yml"

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Verify and materialize benchmark
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/aws-agent-ablation/archive.part* > /tmp/aws-agent-ablation.tar.gz.b64
          base64 --decode /tmp/aws-agent-ablation.tar.gz.b64 > /tmp/aws-agent-ablation.tar.gz
          echo "f4c32923d035dd6b5acc88edb64316668de0a3038abf7308127e039f82611c45  /tmp/aws-agent-ablation.tar.gz" | sha256sum --check -
          tar -tzf /tmp/aws-agent-ablation.tar.gz >/dev/null
          tar -xzf /tmp/aws-agent-ablation.tar.gz
          rm -rf .bootstrap/aws-agent-ablation
          rmdir .bootstrap 2>/dev/null || true
          rm -f .github/workflows/materialize-local-agent-ablation.yml
          rm -f .github/workflows/local-agent-ablation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test: add local AWS Agent skill and pricing ablation"
          git push origin "HEAD:${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
