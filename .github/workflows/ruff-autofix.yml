name: Ruff autofix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  autofix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Clone and apply Ruff fixes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          AUTH="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${AUTH}" \
            clone --branch "${BRANCH}" --single-branch \
            "https://github.com/${GITHUB_REPOSITORY}.git" .
          python -m pip install --quiet 'ruff>=0.11,<1'
          set +e
          ruff check . --fix --output-format=concise >/tmp/ruff.txt 2>&1
          ruff_status=$?
          set -e
          ruff format .
          {
            echo "ruff status after autofix: ${ruff_status}"
            cat /tmp/ruff.txt
          } > ruff-diagnostic.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git diff --cached --check
          git commit --quiet -m "style: apply Ruff fixes"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${AUTH}" \
            push origin "HEAD:${BRANCH}"
