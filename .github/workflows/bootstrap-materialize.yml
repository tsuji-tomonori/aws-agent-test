name: Materialize evaluation harness

on:
  push:
    branches:
      - feat/agent-evaluation-harness
    paths:
      - ".bootstrap/**"
      - ".github/workflows/bootstrap-materialize.yml"
  pull_request:
    branches:
      - main
    paths:
      - ".bootstrap/**"
      - ".github/workflows/bootstrap-materialize.yml"

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Clone, verify, and materialize project
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          AUTH="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${AUTH}" \
            clone --branch "${BRANCH}" --single-branch \
            "https://github.com/${GITHUB_REPOSITORY}.git" .
          cat .bootstrap/archive.part* > /tmp/project.tar.gz.b64
          base64 --decode /tmp/project.tar.gz.b64 > /tmp/project.tar.gz
          echo "bc21b85916a460743df21996240319a93b04e44c690e793c0b52ce7d69654a3a  /tmp/project.tar.gz" | sha256sum --check -
          tar -tzf /tmp/project.tar.gz >/dev/null
          tar -xzf /tmp/project.tar.gz
          rm -rf .bootstrap bootstrap-diagnostic.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add credential-free AWS agent evaluation harness and official AWS fixtures"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${AUTH}" \
            push origin "HEAD:${BRANCH}"
