name: Materialize evaluation harness

on:
  push:
    branches:
      - feat/agent-evaluation-harness
    paths:
      - ".bootstrap/**"
      - ".github/workflows/bootstrap-materialize.yml"
  pull_request:
    branches:
      - main
    paths:
      - ".bootstrap/**"
      - ".github/workflows/bootstrap-materialize.yml"

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Diagnose staged archive
        shell: bash
        run: |
          set +e
          {
            echo "part sizes:"
            wc -c .bootstrap/archive.part*
            cat .bootstrap/archive.part* > /tmp/project.tar.gz.b64
            echo "base64 bytes: $(wc -c < /tmp/project.tar.gz.b64)"
            echo "base64 remainder: $(( $(wc -c < /tmp/project.tar.gz.b64) % 4 ))"
            base64 --decode /tmp/project.tar.gz.b64 > /tmp/project.tar.gz
            decode_status=$?
            echo "decode status: ${decode_status}"
            echo "decoded bytes: $(wc -c < /tmp/project.tar.gz)"
            sha256sum /tmp/project.tar.gz
            tar -tzf /tmp/project.tar.gz >/tmp/tar-list.txt 2>/tmp/tar-error.txt
            tar_status=$?
            echo "tar status: ${tar_status}"
            echo "tar entries: $(wc -l < /tmp/tar-list.txt)"
            echo "tar stderr:"
            cat /tmp/tar-error.txt
          } > bootstrap-diagnostic.txt 2>&1
          cat bootstrap-diagnostic.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bootstrap-diagnostic.txt
          git commit -m "chore: record bootstrap archive diagnostics"
          git push origin "HEAD:${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          exit 1
