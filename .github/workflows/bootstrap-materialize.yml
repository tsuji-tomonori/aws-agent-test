name: Materialize evaluation harness

on:
  push:
    branches:
      - feat/agent-evaluation-harness
    paths:
      - ".bootstrap/**"
      - ".github/workflows/bootstrap-materialize.yml"
  pull_request:
    branches:
      - main
    paths:
      - ".bootstrap/**"
      - ".github/workflows/bootstrap-materialize.yml"

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Verify and materialize project
        shell: bash
        run: |
          set -euo pipefail
          wc -c .bootstrap/archive.part*
          cat .bootstrap/archive.part* > /tmp/project.tar.gz.b64
          base64 --decode /tmp/project.tar.gz.b64 > /tmp/project.tar.gz
          sha256sum /tmp/project.tar.gz
          tar -tzf /tmp/project.tar.gz >/dev/null
          tar -xzf /tmp/project.tar.gz
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-materialize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add credential-free AWS agent evaluation harness and official AWS fixtures"
          git push origin "HEAD:${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
