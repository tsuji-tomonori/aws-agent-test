name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src
      - name: Unit tests
        run: pytest
      - name: Validate datasets
        run: |
          aws-agent-eval validate --dataset datasets/aws-cost-v1
          aws-agent-eval validate --dataset datasets/aws-official-solutions-v1
      - name: Offline evaluation smoke tests
        run: |
          aws-agent-eval experiment \
            --dataset datasets/aws-cost-v1 \
            --profile config/profiles/mock.json \
            --repetitions 1 \
            --run-dir artifacts/general-mock-run
          aws-agent-eval report --run-dir artifacts/general-mock-run

          aws-agent-eval experiment \
            --dataset datasets/aws-official-solutions-v1 \
            --profile config/profiles/mock.json \
            --repetitions 3 \
            --run-dir artifacts/official-mock-run
          aws-agent-eval report --run-dir artifacts/official-mock-run
      - name: Assert credential-free CI
        run: |
          test -z "${AWS_ACCESS_KEY_ID:-}"
          test -z "${AWS_SECRET_ACCESS_KEY:-}"
          test -z "${AWS_SESSION_TOKEN:-}"
      - name: Upload evidence
        if: always() && matrix.python-version == '3.13'
        uses: actions/upload-artifact@v7
        with:
          name: aws-agent-eval-evidence
          path: artifacts/
          if-no-files-found: error
