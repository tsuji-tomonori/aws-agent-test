name: Local AWS Agent ablation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/local-agent-ablation.yml"
      - "benchmarks/**"
      - "datasets/aws-cost-v1/**"
      - "schemas/**"
      - "src/aws_agent_eval/**"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  ablation:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: qwen25-05b
            label: Qwen2.5 0.5B
            model: Qwen/Qwen2.5-0.5B-Instruct
            repetitions: 3
          - id: smollm2-135m
            label: SmolLM2 135M
            model: HuggingFaceTB/SmolLM2-135M-Instruct
            repetitions: 3
    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      HF_HUB_DISABLE_XET: "1"
      TOKENIZERS_PARALLELISM: "false"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache model files
        uses: actions/cache@v5
        with:
          path: .cache/huggingface
          key: local-agent-${{ runner.os }}-${{ matrix.id }}-v1

      - name: Install project and CPU inference dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            'torch>=2.4,<3'
          python -m pip install \
            'transformers>=4.46,<5' \
            'accelerate>=1,<2' \
            'safetensors>=0.4'

      - name: Validate benchmark inputs and pinned Skill
        run: |
          python -m py_compile benchmarks/aws_agent_ablation.py
          python benchmarks/aws_agent_ablation.py --validate-only

      - name: Run controlled four-condition ablation
        run: |
          mkdir -p 'artifacts/${{ matrix.id }}'
          set -o pipefail
          python benchmarks/aws_agent_ablation.py \
            --model '${{ matrix.model }}' \
            --repetitions '${{ matrix.repetitions }}' \
            --threads '2' \
            --temperature '0.2' \
            --max-input-tokens '8192' \
            --max-new-tokens '420' \
            --output-dir 'artifacts/${{ matrix.id }}' \
            2>&1 | tee 'artifacts/${{ matrix.id }}/runner.log'

      - name: Display report
        if: always()
        run: |
          if test -f 'artifacts/${{ matrix.id }}/report.md'; then
            cat 'artifacts/${{ matrix.id }}/report.md'
          fi

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aws-agent-ablation-${{ matrix.id }}
          path: artifacts/${{ matrix.id }}/
          if-no-files-found: error
