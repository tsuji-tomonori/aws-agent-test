AWSTemplateFormatVersion: "2010-09-09"
Description: Usage intentionally omitted for clarification evaluation
Resources:
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      ProtocolType: HTTP
  Handler:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.13
      Handler: index.handler
      MemorySize: 256
      Role: arn:aws:iam::123456789012:role/not-deployed-evaluation-role
      Code:
        ZipFile: |
          def handler(event, context):
              return {"statusCode": 200}
  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
